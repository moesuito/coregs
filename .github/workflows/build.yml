name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK
        shell: pwsh
        env:
          # The SDK the glslang pin was taken from. The version in the download URL is the version pin;
          # the shader-compiler step below checks the installed tool against the SHA-256 pin.
          VULKAN_SDK_VERSION: 1.4.341.1
        run: |
          # Chocolatey installs whatever SDK its package currently carries and sets VULKAN_SDK at machine
          # scope, which the runner's already-started process never sees. Download the pinned installer
          # instead, install it under its own version directory and export VULKAN_SDK for the later steps.
          $version = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$version"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          if (-not (Test-Path $root)) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
            & $installer --accept-licenses --confirm-command --accept-messages "--root=$root" install
            if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK $version installer exited $LASTEXITCODE" }
          }
          $compiler = Join-Path $root 'Bin\glslangValidator.exe'
          if (-not (Test-Path $compiler)) { throw "Vulkan SDK $version installed without $compiler" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV

      - name: Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Shader compiler
        shell: pwsh
        env:
          GLSLANG_SHA256: db832826d73049193882d5572ad76e14fcb7b1cdfc1a6b892ac25217b850b6bc
        run: |
          $compiler = Join-Path $env:VULKAN_SDK 'Bin\glslangValidator.exe'
          if (-not (Test-Path $compiler)) { throw "glslangValidator not found at $compiler" }
          & $compiler --version
          $actual = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "glslangValidator SHA-256: $actual"
          if ($actual -ne $env:GLSLANG_SHA256.ToLowerInvariant()) {
            throw "glslangValidator hash $actual does not match the pin $env:GLSLANG_SHA256"
          }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang-cl

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev glslang-tools mesa-vulkan-drivers

      - name: Shader compiler
        run: |
          glslangValidator --version
          sha256sum "$(command -v glslangValidator)"

      - name: Configure
        # The distro glslang is not the pinned Windows build; the job records its version and
        # hash in the log and builds the shaders with it deliberately.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCOREGS_GLSLANG_PIN=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: ctest --test-dir build --output-on-failure -j 4
